name: Ubuntu dotfiles checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use public Ubuntu APT mirrors
        run: sudo --preserve-env=GITHUB_ACTIONS python3 -B tests/configure-ci-apt.py
      - name: Test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil tmux clangd fontconfig fcitx5 fcitx5-mozc python3-dbus dbus-daemon libglib2.0-bin openjdk-21-jre-headless graphviz fonts-noto-cjk desktop-file-utils libxcb1 libxkbcommon0 libxkbcommon-x11-0 libegl1 libvulkan1 mesa-vulkan-drivers libwayland-client0 libwayland-egl1 xdg-utils sassc libglib2.0-dev-bin libxml2-utils libgtk-3-bin
      - name: Offline checks
        run: |
          python3 -B tests/check-syntax.py
          python3 -B tests/test-ci-apt.py
          python3 -B tests/test-security.py
          python3 -B tests/test-preview-assets.py
          python3 -B tests/test-installer.py
          python3 -B tests/test-planning.py
          python3 -B tests/test-doctor.py
          python3 -B tests/test-ros-workspace.py
          python3 -B tests/test-workflow-tools.py
          python3 -B tests/test-office.py
          python3 -B tests/test-cli.py
          python3 -B tests/test-wsl.py
          python3 -B tests/test-terminal-setup.py
          python3 -B tests/test-japanese-input.py
          python3 -B tests/test-fonts.py
          python3 -B tests/test-editor-cache.py
          python3 -B tests/test-theme-settings.py
          python3 -B tests/test-ros-format.py
          python3 -B tests/test-plantuml-preview.py
          bash tests/test-shell.sh
          python3 -B tests/test-shell-startup.py
          python3 -B tests/test-tmux.py
          bash tests/test-commands.sh
          python3 -B tests/test-fetchall-pty.py
          python3 -B tests/test-image2eps.py
          git diff --check
      - name: Neovim and plugin integration
        run: python3 -B tests/check-neovim.py --plugins
      - name: Starship Gruvbox Rainbow integration
        run: python3 -B tests/check-starship.py
      - name: Workflow tools and shell integration
        run: python3 -B tests/check-workflow-tools.py
      - name: Nerd Font integration
        run: python3 -B tests/check-fonts.py
      - name: WhiteSur build for GNOME 50
        run: python3 -B tests/check-theme.py
      - name: Japanese input directional keys
        run: python3 -B tests/check-japanese-input.py
      - name: Language servers and real keyboard completion
        run: python3 -B tests/check-lsp.py
      - name: ROS formatter integration
        run: python3 -B tests/check-ros-format.py
      - name: PlantUML live preview rendering
        run: python3 -B tests/check-plantuml-preview.py
      - name: Official ibisOffice AppImage and launcher
        run: python3 -B tests/check-office.py
  tex-preview:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use public Ubuntu APT mirrors
        run: sudo --preserve-env=GITHUB_ACTIONS python3 -B tests/configure-ci-apt.py
      - name: TeX test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-lang-japanese texlive-luatex texlive-latex-extra texlive-fonts-recommended poppler-utils zathura zathura-pdf-poppler xvfb xauth imagemagick python3-pil dbus-daemon
      - name: Neovim TeX preview lifecycle
        run: python3 -B tests/check-tex-preview.py
      - name: Japanese and English PDF compilation on save
        run: python3 -B tests/check-tex-preview.py --real-tex
      - name: PDF viewer automatically reloads consecutive saves
        run: python3 -B tests/check-pdf-reload.py
  markdown-preview:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use public Ubuntu APT mirrors
        run: sudo --preserve-env=GITHUB_ACTIONS python3 -B tests/configure-ci-apt.py
      - name: Markdown browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates python3-venv lsof
          python3 -m venv "$RUNNER_TEMP/markdown-preview"
          "$RUNNER_TEMP/markdown-preview/bin/python" -m pip install --no-deps 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
          "$RUNNER_TEMP/markdown-preview/bin/python" -m pip install playwright==1.64.1
          "$RUNNER_TEMP/markdown-preview/bin/python" -m playwright install --with-deps chromium
      - name: Markdown updates in a real browser without manual reload
        run: '"$RUNNER_TEMP/markdown-preview/bin/python" -B tests/check-markdown-preview.py --browser'
  distribution:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use public Ubuntu APT mirrors
        run: sudo --preserve-env=GITHUB_ACTIONS python3 -B tests/configure-ci-apt.py
      - name: Verified ROS repository for Ubuntu 26.04
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'installer')
          from runtime import Runner
          temporary = Path(os.environ['RUNNER_TEMP'])
          version = json.loads(Path('installer/versions.json').read_text())['ros_source']
          Runner(temporary / 'ros-source.log').download(version['url'], temporary / 'ros2-apt-source.deb', version['sha256'])
          PY
          sudo apt-get update
          sudo apt-get install -y --no-remove --no-install-recommends "$RUNNER_TEMP/ros2-apt-source.deb"
          sudo apt-get update
      - name: Official Chrome repository for native amd64
        if: matrix.runner == 'ubuntu-26.04'
        run: |
          if python3 -c 'import sys; sys.path.insert(0, "installer"); from actions import existing_chrome_source; sys.exit(existing_chrome_source() is not None)'; then
            curl --fail --show-error --location --proto '=https' --proto-redir '=https' --output "$RUNNER_TEMP/google.asc" https://dl.google.com/linux/linux_signing_key.pub
            gpg --batch --yes --dearmor --output "$RUNNER_TEMP/google-chrome.gpg" "$RUNNER_TEMP/google.asc"
            sudo install -m 644 "$RUNNER_TEMP/google-chrome.gpg" /usr/share/keyrings/google-chrome.gpg
            printf '%s\n' 'Types: deb' 'URIs: https://dl.google.com/linux/chrome-stable/deb/' 'Suites: stable' 'Components: main' 'Architectures: amd64' 'Signed-By: /usr/share/keyrings/google-chrome.gpg' > "$RUNNER_TEMP/google-chrome.sources"
            sudo install -m 644 "$RUNNER_TEMP/google-chrome.sources" /etc/apt/sources.list.d/google-chrome.sources
          fi
          sudo apt-get update
      - name: Resolve every native and WSL module
        run: python3 -B tests/check-distribution-packages.py
      - name: Neovim and reproducible preview assets on ARM64
        if: matrix.runner == 'ubuntu-26.04-arm'
        run: python3 -B tests/check-neovim.py --plugins
      - name: Workflow tools on ARM64
        if: matrix.runner == 'ubuntu-26.04-arm'
        run: python3 -B tests/check-workflow-tools.py
      - name: ROS build and communication dependencies
        run: sudo apt-get install -y --no-remove --no-install-recommends ros-lyrical-ros-base ros-lyrical-demo-nodes-cpp ros-dev-tools
      - name: ROS 2 Lyrical build and localhost communication
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          /usr/bin/python3 -B tests/check-ros-distribution.py
  windows-settings:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows Terminal settings backup and restoration
        shell: powershell
        run: .\tests\test-windows-fonts.ps1
