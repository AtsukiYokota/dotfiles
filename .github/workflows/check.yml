name: Ubuntu dotfiles checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil tmux clangd fontconfig fcitx5 fcitx5-mozc python3-dbus dbus-daemon libglib2.0-bin openjdk-21-jre-headless graphviz fonts-noto-cjk
      - name: Offline checks
        run: |
          python3 -B tests/check-syntax.py
          python3 -B tests/test-installer.py
          python3 -B tests/test-cli.py
          python3 -B tests/test-wsl.py
          python3 -B tests/test-terminal-setup.py
          python3 -B tests/test-japanese-input.py
          python3 -B tests/test-fonts.py
          python3 -B tests/test-editor-cache.py
          python3 -B tests/test-theme-settings.py
          python3 -B tests/test-ros-format.py
          python3 -B tests/test-plantuml-preview.py
          bash tests/test-shell.sh
          python3 -B tests/test-shell-startup.py
          python3 -B tests/test-tmux.py
          bash tests/test-commands.sh
          python3 -B tests/test-fetchall-pty.py
          python3 -B tests/test-image2eps.py
          git diff --check
      - name: Neovim and plugin integration
        run: python3 -B tests/check-neovim.py --plugins
      - name: Starship Gruvbox Rainbow integration
        run: python3 -B tests/check-starship.py
      - name: Nerd Font integration
        run: python3 -B tests/check-fonts.py
      - name: Japanese input directional keys
        run: python3 -B tests/check-japanese-input.py
      - name: Language servers and real keyboard completion
        run: python3 -B tests/check-lsp.py
      - name: ROS formatter integration
        run: python3 -B tests/check-ros-format.py
      - name: PlantUML live preview rendering
        run: python3 -B tests/check-plantuml-preview.py
  tex-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: TeX test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-lang-japanese texlive-luatex texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Neovim TeX preview lifecycle
        run: python3 -B tests/check-tex-preview.py
      - name: Japanese and English PDF compilation on save
        run: python3 -B tests/check-tex-preview.py --real-tex
  windows-settings:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows Terminal settings backup and restoration
        shell: powershell
        run: .\tests\test-windows-fonts.ps1
