# Ubuntu 24.04 / tmux 3.4. See docs/terminal-workflow.md for terminal shortcuts.
set -g mouse on
set -g history-limit 10000
set -g allow-rename off
set -g default-terminal tmux-256color
set -g status-interval 5
set -g status-justify centre
set -g status-position bottom
# Powerline-like segments are rendered by tmux, without a daemon or plugin.
# ASCII separators also work before a terminal font is configured. The guide
# includes optional triangle separators for existing Powerline/Nerd Font users.
set -g @dotfiles-separator-right '|'
set -g @dotfiles-separator-left '|'
set -g status-left-length 45
set -g status-right-length 60
set -g status-style 'fg=colour252,bg=colour235'
set -g status-left '#[fg=colour235,bg=colour75,bold] #S #[fg=colour75,bg=colour238,nobold]#{@dotfiles-separator-right}#[fg=colour252,bg=colour238]#{?client_prefix, PREFIX ,#{?pane_in_mode, COPY , TMUX }}#[fg=colour238,bg=colour235]#{@dotfiles-separator-right} '
set -g status-right '#[fg=colour238,bg=colour235]#{@dotfiles-separator-left}#[fg=colour252,bg=colour238] #{?window_zoomed_flag,ZOOM ,}#H #[fg=colour75,bg=colour238]#{@dotfiles-separator-left}#[fg=colour235,bg=colour75,bold] %m-%d %H:%M #[default]'
set -g window-status-style 'fg=colour250,bg=colour235'
set -g window-status-format ' #I:#W#F '
set -g window-status-current-style 'fg=colour235,bg=colour114,bold'
set -g window-status-current-format '#[fg=colour235,bg=colour114]#{@dotfiles-separator-right} #I:#W#F #[fg=colour114,bg=colour235]#{@dotfiles-separator-right}'
set -g window-status-separator ''
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour75'
set -g message-style 'fg=colour235,bg=colour114'
set -g mode-style 'fg=colour235,bg=colour114'
set -g display-panes-active-colour blue
set -g display-panes-colour brightred
set -g automatic-rename on
set -g clock-mode-colour green
set -g mode-keys vi
set -sg escape-time 10
set -g focus-events on
set -s extended-keys on
# tmux negotiates this only with terminals it identifies as capable. Do not force
# extkeys on all xterm* terminals: that TERM is also used by VTE/Windows Terminal.
set -g update-environment 'DISPLAY WAYLAND_DISPLAY XAUTHORITY SSH_AUTH_SOCK SSH_CONNECTION SSH_ASKPASS SSH_AGENT_PID KRB5CCNAME WINDOWID WSL_INTEROP WSL_DISTRO_NAME'

# The helper uses a desktop clipboard, or load-buffer -w (OSC 52) over SSH.
# Disable automatic OSC 52 to avoid competing with the desktop clipboard helper.
set -s set-clipboard off
set -s copy-command '"$HOME/.local/bin/dotfiles-clipboard" copy'
bind c copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode C-w send -X copy-pipe-and-cancel
bind -T copy-mode M-w send -X copy-pipe-and-cancel
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -n C-P run-shell '"$HOME/.local/bin/dotfiles-clipboard" tmux-paste #{pane_id}'

unbind C-b
unbind '"'
unbind %
set -g prefix C-x
bind Space send-prefix
# Keep the original Terminator-like bindings. These are Ctrl keys, not portable
# Ctrl+Shift+letter bindings; the outer terminal may consume the shifted form.
# Ctrl+C / Ctrl+V are deliberately left for the application/terminal to handle.
bind -n C-E split-window -h -c '#{pane_current_path}'
bind -n C-S-Left resize-pane -L 3
bind -n C-S-Right resize-pane -R 3
bind -n C-S-Up resize-pane -U 3
bind -n C-S-Down resize-pane -D 3
bind -n C-O split-window -v -c '#{pane_current_path}'
bind -n C-T new-window -c '#{pane_current_path}'
bind -n C-N next-window
bind -n C-W kill-pane
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# Prefix alternatives work even when the terminal/desktop consumes a shortcut.
bind e split-window -h -c '#{pane_current_path}'
bind o split-window -v -c '#{pane_current_path}'
bind t new-window -c '#{pane_current_path}'
bind n next-window
bind w kill-pane
bind p run-shell '"$HOME/.local/bin/dotfiles-clipboard" tmux-paste #{pane_id}'
bind Left select-pane -L
bind Right select-pane -R
bind Up select-pane -U
bind Down select-pane -D
bind -r H resize-pane -L 3
bind -r L resize-pane -R 3
bind -r K resize-pane -U 3
bind -r J resize-pane -D 3
bind r source-file ~/.tmux.conf
if-shell 'test -r "$HOME/.tmux.conf.local"' 'source-file ~/.tmux.conf.local'
